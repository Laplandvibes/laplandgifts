    <!-- 🔴 Merkistö ja viewport ovat headin ENSIMMÄISET tagit.
         Viewport oli aiemmin vasta rivillä 122, eli kaikkien skriptilohkojen
         jälkeen. Se rikkoi heron esilatauksen mitattavasti: esilatauslinkki
         luodaan skriptissä ennen viewport-tagia, joten `imagesizes="100vw"`
         laskettiin selaimen oletusleveyttä (980 px) vasten eikä puhelimen
         390 pikseliä vasten. Selain esilatasi siis 2400 pikselin heron
         jokaiselle puhelimelle, vaikka srcset tarjosi 800 pikselin version
         (85 kt vs 15 kt). Todennettu Chromessa: sama sivu ilman
         esilatausskriptiä valitsi hero-shop-800.avif:n.
         Merkistö kuuluu samasta syystä ensimmäiseksi: ylhäällä olevissa
         skripteissä on japanin- ja kiinankielisiä otsikoita, ja ne
         jäsennettiin ennen kuin dokumentin merkistö oli julistettu. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- LV-LOCALE-TITLE (managed by scripts/inject_locale_titles.mjs) -->
    <script>
      (function () {
        try {
          // 🔴 Sama taulukko on scripts/build-routes-json.mjs:n HOME-lohkossa.
          // Root-reitillä on kaksi metalähdettä: tämä SPA-kuori ja prerenderin
          // scripts/routes.json. Generaattori vertaa näitä ja kaatuu, jos ne
          // eroavat, joten muuta molemmat tai älä kumpaakaan.
          var T = {"en":"Finnish gifts and Lapland souvenirs | LaplandGifts","fi":"Lapin tuliaiset ja suomalaiset lahjat | LaplandGifts","de":"LaplandGifts: finnisches Design und Geschenke aus Lappland","ja":"フィンランドのお土産・ラップランドのギフト | LaplandGifts","es":"LaplandGifts: diseño finlandés y artesanía lapona","pt-br":"Presentes finlandeses e souvenirs da Lapônia | LaplandGifts","zh-cn":"LaplandGifts：芬兰设计与拉普兰手工艺，直送到家","kr":"핀란드 기념품과 라플란드 선물 | LaplandGifts","fr":"Souvenirs de Laponie et artisanat finlandais | LaplandGifts","it":"LaplandGifts: design finlandese e artigianato lappone","nl":"LaplandGifts: Fins design en Laplands ambacht thuisbezorgd","sv":"LaplandGifts: finsk design och lappländskt hantverk"};
          var path = location.pathname || '/';
          var map = { fi: 'fi', de: 'de', ja: 'ja', es: 'es', br: 'pt-br', cn: 'zh-cn', kr: 'kr', fr: 'fr', it: 'it', nl: 'nl', sv: 'sv' };
          // 🔴 Vain kielijuuret. Aiemmin tämä osui myös alasivuihin ja
          // ylikirjoitti prerenderin kirjoittaman sivukohtaisen <title>:n
          // etusivun otsikolla: JavaScriptin ajava indeksoija näki 300
          // sivulla 12 otsikkoa. Alasivuilla kuoressa on jo oikea otsikko.
          var loc = null;
          if (path === '/') loc = 'en';
          else {
            for (var p in map) {
              if (path === '/' + p || path === '/' + p + '/') { loc = map[p]; break; }
            }
          }
          if (loc && T[loc]) document.title = T[loc];
        } catch (e) { /* fail silent */ }
      })();
    </script>
    <!-- /LV-LOCALE-TITLE -->
    <!-- LV-SYNC-LOCALE-REDIRECT (managed by scripts/inject_sync_redirect.mjs) -->
    <script>
      (function () {
        try {
          var path = location.pathname || '/';
          // Already on a locale prefix? — never override
          var prefixes = ['/fi','/de','/ja','/es','/br','/cn','/kr','/fr','/it','/nl','/sv'];
          for (var i = 0; i < prefixes.length; i++) {
            if (path === prefixes[i] || path.indexOf(prefixes[i] + '/') === 0) return;
          }
          // Only redirect from bare root or sub-pages without a locale prefix
          var map = { fi: 'fi', de: 'de', ja: 'ja', es: 'es', 'pt-br': 'br', 'zh-cn': 'cn', ko: 'kr', fr: 'fr', it: 'it', nl: 'nl', sv: 'sv' };
          var stored = null;
          try { stored = localStorage.getItem('lv_locale_choice'); } catch (e) {}
          var target = null;
          if (stored) {
            var k = stored.toLowerCase();
            if (map[k]) target = '/' + map[k];
            else if (k === 'en') return; // explicit EN choice — stay
          }
          if (!target) {
            var langs = navigator.languages || [navigator.language || 'en'];
            for (var j = 0; j < langs.length; j++) {
              var l = (langs[j] || '').toLowerCase();
              if (l.indexOf('en') === 0) return; // EN browser — stay on /
              if (l.indexOf('fi') === 0) { target = '/fi'; break; }
              if (l.indexOf('de') === 0) { target = '/de'; break; }
              if (l.indexOf('ja') === 0) { target = '/ja'; break; }
              if (l.indexOf('es') === 0) { target = '/es'; break; }
              if (l.indexOf('pt') === 0) { target = '/br'; break; }
              if (l.indexOf('zh') === 0) { target = '/cn'; break; }
              if (l.indexOf('ko') === 0) { target = '/kr'; break; }
              if (l.indexOf('fr') === 0) { target = '/fr'; break; }
              if (l.indexOf('it') === 0) { target = '/it'; break; }
              if (l.indexOf('nl') === 0) { target = '/nl'; break; }
              if (l.indexOf('sv') === 0) { target = '/sv'; break; }
            }
          }
          if (!target) return;
          var dest = path === '/' ? target : target + path;
          if (location.search) dest += location.search;
          if (location.hash) dest += location.hash;
          location.replace(dest);
        } catch (err) { /* fail silent — fall through to React-based redirect */ }
      })();
    </script>
    <!-- /LV-SYNC-LOCALE-REDIRECT -->

    <!-- Fontit: yhteys auki heti ja tyylitiedosto rinnakkain sivun kanssa.
         Aiemmin sama pyyntö lähti src/index.css:n @importista, jolloin selain
         ehti ladata ensin koko sivuston CSS:n ja vasta sitten fonttitaulun ja
         vasta sitten fontit — kolme peräkkäistä hyppyä ennen ensimmäistä
         tekstiruutua. gstatic tarvitsee crossoriginin, koska itse fonttitiedosto
         haetaan CORS-tilassa. -->

    <!-- Heron esilataus, vain kielijuurilla. 🔴 Prerender monistaa tämän kuoren
         jokaiselle 336 sivulle, joten staattisena preload-tagina tämä hakisi
         87 kt:n hero-kuvan myös kategoria- ja tuotesivuilla, joilla heroa ei
         ole lainkaan. Skripti ajetaan jäsennyksen aikana ennen sovelluskoodia,
         joten lataus alkaa yhtä aikaisin kuin staattisella tagilla. Sama
         polkulogiikka kuin yllä olevassa LV-LOCALE-TITLE-lohkossa. -->
    <script>
      (function () {
        try {
          var path = location.pathname || '/';
          var roots = ['/', '/fi', '/de', '/ja', '/es', '/br', '/cn', '/kr', '/fr', '/it', '/nl', '/sv'];
          var isRoot = false;
          for (var i = 0; i < roots.length; i++) {
            if (path === roots[i] || path === roots[i] + '/') { isRoot = true; break; }
          }
          if (!isRoot) return;
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.type = 'image/avif';
          // 🔴 Esilatauksen on tarjottava SAMA srcset ja sizes kuin Hero.tsx:n
          // <source>-tagin. Pelkkä href='/images/hero-shop.avif' esilatasi
          // 2400 pikselin tiedoston, minkä jälkeen <img> valitsi ruudulle
          // sopivan pienemmän version — eli kuva ladattiin kahdesti ja
          // ensimmäinen lataus oli se raskain. Nämä leveydet tulevat
          // scripts/build-image-variants.mjs:stä; jos ne muuttuvat, muuta
          // molemmat.
          l.setAttribute(
            'imagesrcset',
            '/images/hero-shop-800.avif 800w, /images/hero-shop-1200.avif 1200w, /images/hero-shop-1600.avif 1600w, /images/hero-shop.avif 2400w'
          );
          l.setAttribute('imagesizes', '100vw');
          l.href = '/images/hero-shop.avif';
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        } catch (e) { /* fail silent */ }
      })();
    </script>
