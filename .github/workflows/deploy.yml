name: Deploy to Cloudflare Pages

# =============================================================================
# Plain checkout. No cross-repo token, no nesting, no symlink.
#
# HISTORY: src/ imported '../../../shared/*' from the PRIVATE parent monorepo
# (Laplandvibes/lv-ops), so a plain checkout always died with TS2307. The
# workaround checked out lv-ops alongside with a PAT (LV_MONOREPO_TOKEN),
# nested the site one level down, and symlinked node_modules to avoid bundling
# two React copies. The PAT was never created, so 'on: push' stayed commented
# out and every deploy was manual from a working tree.
#
# 2026-08-21: shared components are VENDORED into src/shared/ and read from
# git, so a plain checkout builds. LV_MONOREPO_TOKEN is no longer needed.
# Never hand-edit files under src/shared/ — refresh them with sync-shared.
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time per branch. A push that arrives while a deploy is
# running waits for it; if a newer push arrives meanwhile, the older waiting
# run is dropped (the newer commit contains it), so the newest commit always
# deploys last. Without this, two pushes a few minutes apart deployed in
# parallel and whichever finished last won production.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: scripts/build-routes-json.mjs does
          #   import { CATEGORIES } from '../src/data/categories.ts'
          # Node 20 cannot load .ts at all (ERR_UNKNOWN_FILE_EXTENSION); native
          # type-stripping is only on by default from 23.6. Measured 2026-08-21:
          # the first green-build run still died here on node 20.20.2.
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      # ─── LV-PORTIT-CI (13.11.2026) ──────────────────────────────────────────────────────
      # lv-opsin dist-portit ennen julkaisua, sama ajuri ja samat portit kuin deploy-safe.sh:ssa
      # (node scripts/portti.mjs --site <sivusto> --taso dist). lv-ops on yksityinen ja luetaan vain luku
      # -avaimella (lv-opsin deploy key, salaisuus LV_OPS_DEPLOY_KEY). Kaatunut portti PYSÄYTTÄÄ julkaisun.
      # Jos lv-opsia ei saada (avain puuttuu, GitHub-katko), julkaisu jatkuu varoituksella.
      # Hätäohitus: Actions-muuttuja LV_PORTIT_POIS=1 (repo tai organisaatio); kirjaa syy.
      - name: LV-portit — lv-ops (vain luku)
        id: lvops
        if: ${{ vars.LV_PORTIT_POIS != '1' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Laplandvibes/lv-ops
          ssh-key: ${{ secrets.LV_OPS_DEPLOY_KEY }}
          path: _lv-ops

      - name: LV-portit — Node 24 (sama kuin deploy-safe.sh)
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: LV-portit — dist
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        env:
          SIVUSTO_DIR: laplandgifts
        run: |
          # Portit etsivät sivuston lv-opsin juuresta (<lv-ops>/<sivusto>), kuten Vesan koneella.
          mv _lv-ops "$RUNNER_TEMP/lv-ops"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lv-ops/$SIVUSTO_DIR"
          cd "$RUNNER_TEMP/lv-ops"
          npm ci --no-audit --no-fund
          node scripts/portti.mjs --site "$SIVUSTO_DIR" --taso dist

      # Julkaisuvaihe ajetaan sivuston omalla Node-versiolla, kuten ennen tätä lohkoa.
      - name: LV-portit — sivuston oma Node takaisin
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: LV-portit — ohitettu
        if: ${{ vars.LV_PORTIT_POIS == '1' || steps.lvops.outcome != 'success' }}
        run: echo "::warning::LV-portit ohitettu (LV_PORTIT_POIS='${{ vars.LV_PORTIT_POIS }}', lv-ops-haku='${{ steps.lvops.outcome }}')"
      # ─── /LV-PORTIT-CI ───────────────────────────────────────────────────────────────────

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=laplandgifts --branch=main
